server:
  port: 9090
spring:
  config:
    # 笔记：[Boot] spring.config.import
    # Spring Boot 2.4+ 的配置导入机制，把另一个配置文件引入当前文件合并加载。
    # optional: 前缀表示该文件不存在时不报错、直接跳过，适合 application-local.yml 这种本地可选覆盖文件。
    # 不带 optional 则文件必须存在，否则启动失败。
    import: optional:classpath:application-local.yml
  datasource:
    # PostgreSQL 数据源配置
    url: ${DB_URL:jdbc:postgresql://localhost:5432/springboot_vue?currentSchema=public&sslmode=disable}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  aop:
    # 笔记：[Boot] spring.aop.proxy-target-class
    # 控制代理类型：true（默认）用 CGLIB 生成子类代理，能代理非接口的 public 方法；
    #   false 用 JDK 动态代理，只代理目标对象实现的接口方法，非接口方法不被代理。
    # Spring Boot 4 默认 true；切到 false 后 selectById（不在接口）的切点会失效。
    proxy-target-class: true
  mail:
    # 指定邮件服务器地址
    host: ${MAIL_HOST:smtp.qq.com}
    # 登录账户
    username: ${MAIL_USERNAME:}
    # 登录密码
    password: ${MAIL_PASSWORD:}
    # 端口
    port: ${MAIL_PORT:465}
    # 默认编码
    default-encoding: UTF-8
    # 使用的协议
    protocol: smtps
    # 其他的属性
    properties:
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 3000
      "mail.smtp.writetimeout": 5000
      "mail.smtp.auth": true
      "mail.smtp.starttls.enable": true
      "mail.smtp.starttls.required": true


springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${DOCS_ENABLED:false}
  writer-with-order-by-keys: false

mybatis-plus:
  # 笔记：[MyBatis] mapper-locations: classpath*
  # classpath* 和 classpath 的区别：classpath 只扫第一个匹配资源，classpath* 扫描所有 jar/目录下的匹配资源。
  # 多模块项目里 mapper XML 分散在各模块 jar 中，必须用 classpath* 才能全部加载，用 classpath 会漏掉其他模块的 XML。
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.xinmengqaq.springboot.*.entity
  configuration:
    # 笔记：[MyBatis] map-underscore-to-camel-case
    # 开启后 MyBatis 自动把数据库下划线列名映射到 Java 驼峰属性：password_version -> passwordVersion。
    # 不开启则列名必须和属性名完全一致才能映射，否则查询结果对应字段为 null，是常见踩坑点。
    map-underscore-to-camel-case: true
    # 笔记：[MyBatis·日志] log-impl=NoLoggingImpl
    # 生产环境使用 NoLoggingImpl 关闭 MyBatis SQL 日志，避免 SQL 与参数输出到控制台。
    # 它只影响 MyBatis SQL 日志，不影响由 Logback 管理的业务告警与错误日志。
    # 本地调试 SQL 时可在未提交的本地覆盖配置中改用 StdOutImpl，禁止将调试值带入生产包。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    # 二级缓存：开启后 MyBatis 会缓存查询结果，避免重复查询数据库，提高性能。
    cache-enabled: false
  # 全局配置：MyBatis Plus 提供的全局配置项，影响所有 Mapper 接口的默认行为。
  global-config:
    # 数据库配置：MyBatis Plus 提供的数据库配置项，影响所有 Mapper 接口的默认行为。
    db-config:
      # 开启后 MyBatis Plus 会自动为实体类的主键字段生成 ID，无需手动设置。
      id-type: auto

jwt:
  secret: ${JWT_SECRET:}
  expire-seconds: 28800
  clock-skew-seconds: 120

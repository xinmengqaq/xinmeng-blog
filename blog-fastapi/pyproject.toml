[project]
name = "blog-fastapi"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "pydantic>=2.13.4",
    "loguru>=0.7.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.51.0",
    "pillow>=10.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.8",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
# 临时目录放项目下，避免挤占 C 盘系统临时目录
addopts = "--basetemp=.pytest-tmp"

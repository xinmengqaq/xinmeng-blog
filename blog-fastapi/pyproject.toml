[project]
name = "blog-fastapi"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pyjwt>=2.8",
    "loguru>=0.7.3",
    "pillow>=10.3",
    "mutagen>=1.48.1",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"

[tool.uv]
# 清华 PyPI 镜像，加速依赖下载
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
